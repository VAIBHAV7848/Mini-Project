openapi: 3.1.0
info:
  title: Milestone-Based Escrow & Evidence-Based Dispute Resolution Workflow API
  version: 1.0.0
  description: >
    Authoritative REST API specification for Team 07 (KLE Technological University).
    Implements milestone state scheduling, SHA-256 evidence integrity, ACID financial transfers,
    and role-based workflow coordination.
servers:
  - url: http://localhost:3000/api
    description: Local Academic Evaluation Server

paths:
  /auth/login:
    post:
      summary: Authenticate user credentials
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/session:
    get:
      summary: Retrieve current authenticated session
      operationId: getSession
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /projects:
    get:
      summary: List open marketplace projects
      operationId: listProjects
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
            default: OPEN
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
    post:
      summary: Post a new project specification
      operationId: createProject
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /projects/{id}:
    get:
      summary: Get project details by ID
      operationId: getProjectById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed project specification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /proposals:
    post:
      summary: Submit a proposal bid for a project
      operationId: submitProposal
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '201':
          description: Proposal submitted and AI match score calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Developer has already submitted a proposal for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /contracts:
    get:
      summary: List active contracts for current user
      operationId: listContracts
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Active contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractsList'
    post:
      summary: Execute Core Contract Action Protocol (Deposit, Submit, Approve, Release, Dispute)
      operationId: executeContractAction
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractActionRequest'
      responses:
        '200':
          description: State transition executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: State mutex lock conflict or duplicate funding attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /contracts/{id}:
    get:
      summary: Fetch contract aggregate with milestones and current escrow balance
      operationId: getContractById
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contract aggregate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractAggregateResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /contracts/{id}/milestones:
    get:
      summary: 5-Second Polling Hot Path - Fetch current status of all milestones
      operationId: pollMilestones
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Milestone statuses for real-time UI synchronization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePollingResponse'

  /gigs:
    get:
      summary: Query marketplace service gigs
      operationId: listGigs
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of service gigs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigsList'
    post:
      summary: Create a tiered service gig
      operationId: createGig
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGigRequest'
      responses:
        '201':
          description: Gig created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigResponse'

  /orders:
    get:
      summary: List user gig orders
      operationId: listOrders
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Active orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersList'
    post:
      summary: Place a gig order
      operationId: placeOrder
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /developers:
    get:
      summary: Browse developer profiles and DevScores
      operationId: listDevelopers
      parameters:
        - name: skill
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Developer directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopersList'

  /analyze-github:
    post:
      summary: Verify developer GitHub profile and calculate DevScore
      operationId: analyzeGitHubProfile
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [githubUsername]
              properties:
                githubUsername:
                  type: string
      responses:
        '200':
          description: GitHub profile metrics and verified DevScore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAnalysisResponse'

  /disputes:
    post:
      summary: File formal milestone dispute
      operationId: fileDispute
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDisputeRequest'
      responses:
        '201':
          description: Dispute filed and contract escrow frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'

  /disputes/{id}:
    get:
      summary: Fetch dispute details with N-ary EvidenceTree
      operationId: getDisputeById
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispute claim and verified EvidenceTree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeWithEvidenceResponse'

  /disputes/{id}/ruling:
    post:
      summary: Render binding arbitration ruling
      operationId: submitDisputeRuling
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRulingRequest'
      responses:
        '200':
          description: Ruling rendered and escrow released/refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulingResponse'
        '403':
          description: Only assigned Reviewer can submit rulings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /audit-logs:
    get:
      summary: Inspect tamper-resistant institutional audit trail
      operationId: listAuditLogs
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated audit trail with chained verification hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
        '403':
          description: Admin role required for audit inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestError:
      description: Zod validation error or invalid FSM state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Caller lacks required RBAC role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_STATE_TRANSITION
            message:
              type: string
              example: Transition not permitted from current state.
            details:
              type: array
              items:
                type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      required: [timestamp, requestId]
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string

    CreateProjectRequest:
      type: object
      required: [title, description, budget, skillTags]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          minLength: 20
        budget:
          type: number
          minimum: 10.00
        skillTags:
          type: array
          items:
            type: string
          minItems: 1

    SubmitProposalRequest:
      type: object
      required: [projectId, bidAmount, coverLetter]
      properties:
        projectId:
          type: string
          format: uuid
        bidAmount:
          type: number
          minimum: 1.00
        coverLetter:
          type: string
          minLength: 20

    ContractActionRequest:
      type: object
      required: [action, contractId]
      properties:
        action:
          type: string
          enum: [DEPOSIT, START_WORK, SUBMIT_DELIVERABLE, APPROVE_MILESTONE, RELEASE_ESCROW, RAISE_DISPUTE]
        contractId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
        amount:
          type: number
        deliverableUrl:
          type: string
          format: uri
        submissionNotes:
          type: string
        reason:
          type: string

    FileDisputeRequest:
      type: object
      required: [milestoneId, reason]
      properties:
        milestoneId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 15

    DisputeRulingRequest:
      type: object
      required: [ruling, rulingNotes]
      properties:
        ruling:
          type: string
          enum: [RELEASE_TO_FREELANCER, REFUND_TO_CLIENT]
        rulingNotes:
          type: string
          minLength: 20

    CreateGigRequest:
      type: object
      required: [title, description, category, tiers]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        tiers:
          type: array
          items:
            type: object

    PlaceOrderRequest:
      type: object
      required: [gigId, tierName, amount]
      properties:
        gigId:
          type: string
          format: uuid
        tierName:
          type: string
        amount:
          type: number

    UserResponse:
      type: object
    ProjectResponse:
      type: object
    PaginatedProjects:
      type: object
    ProposalResponse:
      type: object
    ContractsList:
      type: object
    ContractActionResponse:
      type: object
    ContractAggregateResponse:
      type: object
    MilestonePollingResponse:
      type: object
    GigsList:
      type: object
    GigResponse:
      type: object
    OrdersList:
      type: object
    OrderResponse:
      type: object
    DevelopersList:
      type: object
    GitHubAnalysisResponse:
      type: object
    DisputeResponse:
      type: object
    DisputeWithEvidenceResponse:
      type: object
    RulingResponse:
      type: object
    AuditLogsResponse:
      type: object
